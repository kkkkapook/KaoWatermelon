<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <link href="index.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <!-- Firebase SDK (Compat 모드) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <title>토체체토</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="watermelon" />
    <meta property="og:title" content="watermelon" />
    <meta property="og:description" content="Play Watermelon Game!" />
    <meta property="og:image" content="assets/img/7.png" />
    <meta property="og:image:type" content="image/png" />

    <link rel="icon shortcut" href="assets/img/7.png" type="image/x-icon" />

    <style>
      /* 화면 바깥 스크롤 및 바운스 터치 전면 금지 */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        background-color: #fce885;
      }

      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      #game {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        margin: 0 auto;
      }

      /* 갈색 바닥 영역 내부 스타일 (랭킹 + 크레딧 가로 정렬) */
      #floor {
        width: 100%;
        background-color: #b37346; /* 기존 바닥 갈색 */
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 0 15px;
        box-sizing: border-box;
        color: #fff;
        font-family: "Pretendard", sans-serif;
        font-size: 12px;
        z-index: 10;
      }

      /* 갈색 바닥 안의 TOP 3 랭킹 가로 배치 */
      #leaderboard {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #leaderboard h3 {
        margin: 0;
        font-size: 12px;
        color: #ffd700;
        white-space: nowrap;
      }
      #leaderboard ol {
        display: flex;
        flex-direction: row;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #leaderboard li {
        margin: 0;
        white-space: nowrap;
        background: rgba(0, 0, 0, 0.25);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .credit-text {
        margin: 0;
        font-size: 11px;
        opacity: 0.9;
        white-space: nowrap;
      }

      /* 오버레이 및 팝업 정돈 */
      #overlay {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding-top: 100px;
      }

      #scoreInputModal {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.9);
        padding: 20px 25px;
        border-radius: 16px;
        z-index: 200;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      }
      #scoreInputModal input {
        padding: 10px 14px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid #555;
        outline: none;
        text-align: center;
        width: 180px;
        background: #222;
        color: #fff;
      }
      #scoreInputModal input:focus {
        border-color: #39af3d;
      }
      #submitScoreBtn {
        padding: 10px 20px;
        font-size: 15px;
        font-weight: bold;
        background: #39af3d;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
      }
      #submitScoreBtn:hover {
        background: #2e8c31;
      }

      #playAgainButton {
        margin-top: 10px;
        z-index: 150;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="item" id="game">
        <div id="overlay">
          <!-- 닉네임 입력 폼 -->
          <div id="scoreInputModal">
            <p style="margin: 0; color: #ffd700; font-weight: bold; font-size: 18px;">
              🎉 TOP 3 달성!
            </p>
            <input
              type="text"
              id="nicknameInput"
              maxlength="6"
              placeholder="닉네임 (최대 6자)"
            />
            <button id="submitScoreBtn">기록 남기기</button>
          </div>

          <!-- Play Again 버튼 -->
          <button id="playAgainButton" onclick="location.reload()">
            Play Again
          </button>
        </div>

        <!-- 게임 캔버스 -->
        <canvas id="canvas"></canvas>

        <!-- 갈색 바닥 (랭킹 가로 배치 + Made by 문구 통합) -->
        <div id="floor">
          <div id="leaderboard">
            <h3>🏆 TOP 3</h3>
            <ol id="rankList">
              <li>불러오는 중...</li>
            </ol>
          </div>
          <p class="credit-text">Made by ❤️ yangchi</p>
        </div>
      </div>
    </div>

    <script defer src="index.js"></script>
  </body>
</html>
