<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <link href="index.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <!-- Firebase SDK (Compat 모드) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <title>토체체토</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="watermelon" />
    <meta property="og:title" content="watermelon" />
    <meta property="og:description" content="Play Watermelon Game!" />
    <meta property="og:image" content="assets/img/7.png" />
    <meta property="og:image:type" content="image/png" />

    <link rel="icon shortcut" href="assets/img/7.png" type="image/x-icon" />

    <style>
      /* 화면 전체 스크롤 및 터치 바운스 완벽 금지 */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        background-color: #fce885;
      }

      .container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #game {
        position: relative;
        width: 480px;
        height: 750px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* TOP 3 랭킹 - Canvas 오른쪽 상단에 고정 */
      #leaderboard {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 8px 12px;
        border-radius: 10px;
        font-family: "Pretendard", sans-serif;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        z-index: 100;
        pointer-events: none;
      }
      #leaderboard h3 {
        margin: 0 0 4px 0;
        font-size: 12px;
        color: #ffd700;
        text-align: center;
      }
      #leaderboard ol {
        margin: 0;
        padding-left: 16px;
        font-size: 11px;
      }
      #leaderboard li {
        margin-bottom: 2px;
        white-space: nowrap;
      }

      /* 게임 오버 레이어 및 모달 */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        z-index: 150;
      }

      #scoreInputModal {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.9);
        padding: 20px 25px;
        border-radius: 16px;
        z-index: 200;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      }
      #scoreInputModal input {
        padding: 10px 14px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid #555;
        outline: none;
        text-align: center;
        width: 180px;
        background: #222;
        color: #fff;
      }
      #scoreInputModal input:focus {
        border-color: #39af3d;
      }
      #submitScoreBtn {
        padding: 10px 20px;
        font-size: 15px;
        font-weight: bold;
        background: #39af3d;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
      }
      #submitScoreBtn:hover {
        background: #2e8c31;
      }

      #playAgainButton {
        margin-top: 10px;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        background: #ff5252;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }

      .credit-text {
        margin-top: 6px;
        font-size: 13px;
        font-family: "Pretendard", sans-serif;
        color: #555;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="game">
        <!-- TOP 3 랭킹 -->
        <div id="leaderboard">
          <h3>🏆 TOP 3</h3>
          <ol id="rankList">
            <li>불러오는 중...</li>
          </ol>
        </div>

        <!-- 오버레이 및 모달 -->
        <div id="overlay">
          <div id="scoreInputModal">
            <p style="margin: 0; color: #ffd700; font-weight: bold; font-size: 18px;">
              🎉 TOP 3 달성!
            </p>
            <input
              type="text"
              id="nicknameInput"
              maxlength="6"
              placeholder="닉네임 (최대 6자)"
            />
            <button id="submitScoreBtn">기록 남기기</button>
          </div>

          <button id="playAgainButton" onclick="location.reload()">
            Play Again
          </button>
        </div>

        <canvas id="canvas"></canvas>
        <p class="credit-text">Made by ❤️ yangchi</p>
      </div>
    </div>

    <script defer src="index.js"></script>
  </body>
</html>
