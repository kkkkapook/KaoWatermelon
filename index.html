<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <link href="index.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <title>토체체토</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="watermelon" />
    <meta property="og:title" content="watermelon" />
    <meta property="og:description" content="Play Watermelon Game!" />
    <meta property="og:image" content="assets/img/7.png" />
    <meta property="og:image:type" content="image/png" />

    <link rel="icon shortcut" href="assets/img/7.png" type="image/x-icon" />
  </head>

  <body>
    <div class="container">
      <div class="item"></div>

      <div class="item" id="game">
        <!-- [테스트용] 우측 상단 강제 종료 버튼 -->
        <button id="testGameOverBtn">💥 강제종료</button>

        <div id="overlay">
          <button id="playAgainButton" onclick="location.reload()">
            Play Again
          </button>
        </div>

        <canvas id="canvas"></canvas>

        <div id="floor">
          <p>Made by ❤️ yangchi</p>
          <button id="rankToggleBtn">🏆 Top 10</button>
        </div>
      </div>

      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
    </div>

    <!-- Top 10 랭킹 팝업 모달 -->
    <div id="leaderboardModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🏆 Top 10 랭킹</h3>
          <button id="closeModalBtn">&times;</button>
        </div>
        <ol id="rankList">
          <li>불러오는 중...</li>
        </ol>
      </div>
    </div>

    <!-- 닉네임 입력 팝업 모달 -->
    <div id="nicknameModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🎉 Top 10 진입 성공!</h3>
        </div>
        <div class="modal-body">
          <p id="finalScoreText">최종 점수: 0점</p>
          <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="10" />
          <button id="submitScoreBtn">점수 등록</button>
        </div>
      </div>
    </div>

    <script defer src="index.js"></script>
  </body>
</html>
